name: Apply requested calculator changes
'on': [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/update.py
          python /tmp/update.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Implement automatic stay dates and share formatting' && git push)
