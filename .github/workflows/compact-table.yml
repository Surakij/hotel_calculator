name: Update calculator

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacement='.discounts{display:flex !important;flex-direction:row !important;align-items:center;gap:3px;min-width:260px}.discounts .discount{flex:1 1 0;width:0 !important;min-width:0 !important;height:32px;padding:3px;text-align:center}'
          s=re.sub(r'\.discounts\{[^}]*\}(?:\.discounts \.discount\{[^}]*\})?', replacement, s, count=1)
          s=re.sub(r'table\{width:100%;border-collapse:collapse;min-width:[^}]+\}', 'table{width:100%;border-collapse:collapse;min-width:1280px}', s, count=1)
          start=s.index('function shareText(){')
          end=s.index('\nfunction showShare()', start)
          new=Path('.github/shareText.js').read_text(encoding='utf-8').rstrip()+"\n"
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY2
      - name: Commit updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Apply calculator formatting' && git push)
