<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Calculation</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/core.js" defer></script>
  <script src="assets/hotelData.js" defer></script>
  <script src="assets/app.js" defer></script>
  <script src="assets/hotelSelect.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="title">HOTEL CALCULATION</header>

    <section class="cards" aria-label="Stay details">
      <div class="card">
        <label for="hotel">HOTEL</label>
        <div class="field-with-action hotel-field">
          <input id="hotel" placeholder="Choose or type hotel" autocomplete="off" aria-haspopup="listbox">
          <div id="hotelMenu" class="hotel-menu" role="listbox"></div>
        </div>
      </div>
      <div class="card">
        <label for="checkin">CHECK-IN</label>
        <input id="checkin" class="date-input" inputmode="numeric" placeholder="DD.MM.YYYY" autocomplete="off">
      </div>
      <div class="card">
        <label for="checkout">CHECK-OUT</label>
        <input id="checkout" class="date-input" inputmode="numeric" placeholder="DD.MM.YYYY" autocomplete="off">
      </div>
      <div class="card">
        <label for="nights">NIGHTS</label>
        <input id="nights" type="number" min="0" max="365" step="1" value="0">
      </div>
      <div class="card total">
        <label for="topTotal">TOTAL NET (USD)</label>
        <input id="topTotal" readonly value="0.00">
      </div>
    </section>

    <section class="guests" aria-label="Guest details">
      <div class="guest">
        <label for="adults">ADULTS</label>
        <input id="adults" type="number" min="0" step="1" value="0">
      </div>
      <div class="guest">
        <label for="children">CHILDREN</label>
        <input id="children" type="number" min="0" step="1" value="0">
      </div>
      <div class="guest">
        <label for="infants">INFANTS</label>
        <input id="infants" type="number" min="0" step="1" value="0">
      </div>
      <div class="guest">
        <label for="ages">CHILD AGES</label>
        <input id="ages" placeholder="e.g. 2, 6, 9">
      </div>
      <div class="guest">
        <label for="spo">SPO</label>
        <input id="spo" placeholder="Enter SPO code">
      </div>
    </section>

    <section class="toolbar" aria-label="Calculation actions">
      <div class="hint">One row = one charge / rate period. TYPE -> ITEM. Manual entry is allowed.</div>
      <div class="actions">
        <button id="addRow" class="add" type="button">+ ADD ROW</button>
        <button id="clearAll" class="clear" type="button">CLEAR ALL</button>
        <button id="showShare" class="share" type="button">COPY SHARE</button>
        <button id="downloadShare" class="download" type="button">DOWNLOAD SHARE</button>
      </div>
    </section>

    <section class="table-wrap" aria-label="Calculation rows">
      <table>
        <thead>
          <tr>
            <th>TYPE</th>
            <th>ITEM / DESCRIPTION</th>
            <th>FROM</th>
            <th>TO</th>
            <th>NIGHTS</th>
            <th>QTY</th>
            <th>RATE (USD)</th>
            <th>DISCOUNTS %</th>
            <th>NET (USD)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <section id="staySummary" class="summary-wrap" aria-label="Stay and meal summary"></section>

    <footer class="footer">
      <div class="grand">GRAND TOTAL NET <span id="grandTotal">$0.00</span></div>
    </footer>
  </main>

  <datalist id="hotelList"></datalist>
  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="shareModal" class="modal">
    <div class="modal-head">
      <h2>Short Share Version</h2>
      <button id="closeShare" class="close" type="button">Close</button>
    </div>
    <pre id="shareText" class="share-preview"></pre>
    <div class="actions">
      <button id="copyShare" class="share" type="button">COPY TO CLIPBOARD</button>
      <button id="downloadShareModal" class="download" type="button">DOWNLOAD .TXT</button>
    </div>
  </dialog>
</body>
</html>
