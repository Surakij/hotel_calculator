<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maldives Hotel Quotation & Reservation Calculator</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/core.js" defer></script>
  <script src="assets/hotelData.js" defer></script>
  <script src="assets/storage.js" defer></script>
  <script src="assets/googleConfig.js" defer></script>
  <script src="assets/googleDrive.js" defer></script>
  <script src="assets/app.js" defer></script>
  <script src="assets/hotelReselect.js" defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="app">
    <header class="title">
      <div class="brand">
        <img class="brand-mark" src="assets/logo.svg" alt="" aria-hidden="true">
        <span>HOTEL CALCULATOR</span>
      </div>
    </header>

    <section class="cards" aria-label="Stay details">
      <div class="card">
        <label for="hotel">HOTEL</label>
        <input id="hotel" placeholder="Choose or type hotel" autocomplete="off" aria-haspopup="dialog">
      </div>
      <div class="card">
        <label for="checkin">CHECK-IN</label>
        <input id="checkin" class="date-input" inputmode="numeric" placeholder="DD.MM.YYYY" autocomplete="off">
      </div>
      <div class="card">
        <label for="checkout">CHECK-OUT</label>
        <input id="checkout" class="date-input" inputmode="numeric" placeholder="DD.MM.YYYY" autocomplete="off">
      </div>
      <div class="card">
        <label for="nights">NIGHTS</label>
        <input id="nights" type="number" min="0" max="365" step="1" value="0">
      </div>
      <div class="card total">
        <label for="topTotal">TOTAL NET (USD)</label>
        <input id="topTotal" readonly value="0.00">
      </div>
    </section>

    <section class="guests" aria-label="Guest details">
      <div class="guest">
        <label for="adults">ADULTS</label>
        <input id="adults" type="number" min="0" step="1" value="0">
      </div>
      <div class="guest">
        <label for="children">CHILDREN</label>
        <input id="children" type="number" min="0" step="1" value="0">
      </div>
      <div class="guest">
        <label for="infants">INFANTS</label>
        <input id="infants" type="number" min="0" step="1" value="0">
      </div>
      <div class="guest">
        <label for="ages">CHILD AGES</label>
        <input id="ages" placeholder="e.g. 2, 6, 9">
      </div>
      <div class="guest">
        <label for="spo">SPO CODE</label>
        <input id="spo" placeholder="Enter SPO code">
      </div>
    </section>

    <section class="toolbar" aria-label="Calculation actions">
      <div class="hint">One row = one charge / rate period. TYPE -> ITEM. Manual entry is allowed.</div>
      <div class="actions">
        <button id="addRow" class="add" type="button"><svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add row</button>
        <button id="clearAll" class="clear" type="button"><svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Clear all</button>
        <button id="saveCalculation" class="save" type="button"><svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M19 21H5V3h11l3 3v15ZM8 3v6h8M8 17h8"/></svg>Save</button>
        <button id="showHistory" class="history" type="button"><svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 8v5l3 2M4 12a8 8 0 1 0 2.3-5.7M4 4v5h5"/></svg>History</button>
        <button id="showShare" class="share" type="button"><svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 8h10v12H8zM6 16H4V4h12v2"/></svg>Copy Share</button>
        <button id="downloadShare" class="download" type="button"><svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4M5 20h14"/></svg>Download Share</button>
      </div>
    </section>

    <section class="table-wrap" aria-label="Calculation rows">
      <table>
        <thead>
          <tr>
            <th>TYPE</th>
            <th>ITEM / DESCRIPTION</th>
            <th>FROM</th>
            <th>TO</th>
            <th>NIGHTS</th>
            <th>QTY</th>
            <th>RATE (USD)</th>
            <th>DISCOUNTS %</th>
            <th>NET (USD)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <section id="staySummary" class="summary-wrap" aria-label="Stay and meal summary"></section>

    <footer class="footer">
      <div class="version" id="appVersion">v1.0.0</div>
      <div class="grand">GRAND TOTAL NET <span id="grandTotal">$0.00</span></div>
    </footer>
  </main>

  <datalist id="hotelList"></datalist>
  <div id="hotelPicker" class="hotel-picker" role="dialog" aria-label="Choose hotel"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="shareModal" class="modal">
    <div class="modal-head">
      <h2>Short Share Version</h2>
      <button id="closeShare" class="close" type="button">Close</button>
    </div>
    <pre id="shareText" class="share-preview"></pre>
    <div class="actions">
      <button id="copyShare" class="share" type="button">COPY TO CLIPBOARD</button>
      <button id="downloadShareModal" class="download" type="button">DOWNLOAD .TXT</button>
    </div>
  </dialog>

  <dialog id="historyModal" class="modal history-modal">
    <div class="modal-head">
      <h2>Saved Calculations</h2>
      <button id="closeHistory" class="close" type="button">Close</button>
    </div>
    <div class="history-tools">
      <input id="historySearch" placeholder="Search hotel, date, SPO, total">
      <button id="connectDrive" class="history" type="button">Sign in with Google</button>
      <button id="syncDrive" class="save" type="button">Sync Drive</button>
      <button id="exportHistory" class="download" type="button">Export Backup</button>
      <button id="importHistory" class="add" type="button">Import Backup</button>
      <button id="signOutDrive" class="clear" type="button">Sign out</button>
      <input id="historyFile" type="file" accept="application/json,.json" hidden>
    </div>
    <div id="driveStatus" class="drive-status"></div>
    <div id="historyList" class="history-list"></div>
  </dialog>
</body>
</html>
