<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Maldives Hotel Calculator logo">
  <style>
    .sun { transform-origin: 47px 15px; animation: sunPulse 4.8s ease-in-out infinite; }
    .wave-front { animation: waveDrift 3.8s ease-in-out infinite; }
    .wave-back { animation: waveDriftBack 4.6s ease-in-out infinite; }
    .palm { transform-origin: 31px 34px; animation: palmSway 4.2s ease-in-out infinite; }
    @keyframes sunPulse {
      0%, 100% { transform: scale(1); opacity: .92; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes waveDrift {
      0%, 100% { transform: translateX(-1px); }
      50% { transform: translateX(2px); }
    }
    @keyframes waveDriftBack {
      0%, 100% { transform: translateX(2px); }
      50% { transform: translateX(-1px); }
    }
    @keyframes palmSway {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sun, .wave-front, .wave-back, .palm { animation: none; }
    }
  </style>
  <rect width="64" height="64" rx="14" fill="#082758"/>
  <path d="M8 47c7-5 13-5 20 0s13 5 20 0 8-4 8-4v13H8V47Z" fill="#184a7a"/>
  <path class="wave-back" d="M8 45c7-5 13-5 20 0s13 5 20 0 8-4 8-4" fill="none" stroke="#6db7d8" stroke-width="3" stroke-linecap="round"/>
  <path class="wave-front" d="M9 50c7-4 13-4 19 0s13 4 19 0 8-3 8-3" fill="none" stroke="#b9f3ff" stroke-width="3.5" stroke-linecap="round"/>
  <circle class="sun" cx="47" cy="15" r="6" fill="#f6c04f"/>
  <path d="M22 44c3-4 9-6 17-4 5 1 8 3 10 4H22Z" fill="#f2d38a"/>
  <g class="palm">
    <path d="M31 42c1-8 1-16 0-23" fill="none" stroke="#f8fafc" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M31 20c-6 1-10 4-13 9 6-3 10-4 13-3" fill="#36b37e"/>
    <path d="M32 20c5 0 10 2 14 7-6-2-10-2-14 0" fill="#4ade80"/>
    <path d="M31 19c-4-4-9-5-14-4 5 2 9 4 12 8" fill="#2fb76e"/>
    <path d="M32 19c3-4 7-6 12-7-3 4-6 7-11 10" fill="#69d68b"/>
  </g>
  <path d="M15 21v17h5v-7h8v7h5V21h-5v6h-8v-6h-5Z" fill="#fff"/>
</svg>
